name: CHZ WhatsApp Agent pilot tests
on:
  pull_request:
    paths:
      - "pilots/chz-wa-agent-001/**"
      - ".github/workflows/chz-wa-agent-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Core unit tests
        run: node --test tests/*.test.mjs
        working-directory: pilots/chz-wa-agent-001
