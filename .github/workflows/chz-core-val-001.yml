name: CHZ CORE VAL 001 unit tests
on:
  pull_request:
    paths:
      - "experiments/CHZ-CORE-VAL-001/**"
      - ".github/workflows/chz-core-val-001.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic core unit tests
        run: python3 -m unittest discover -s tests -v
        working-directory: experiments/CHZ-CORE-VAL-001
